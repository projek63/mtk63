<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perkalian & Pembagian Dasar</title>
  <meta name="description" content="Belajar perkalian dan pembagian dasar secara interaktif.">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #475569;
      z-index: 0;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #cbd5e1;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #fallback { font-size: 14px; }
    #fallback a { color: #2563eb; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Memuat aplikasi…</div>
    <div id="fallback">
      Tidak muncul? <a href="https://script.google.com/macros/s/AKfycbxXi7waJB2ZMeheiXaEj6uyDhRo9So1Ne_03ylJyBKR7Ac2Culg4V--1s-_u7GjPQ7mmw/exec" target="_blank" rel="noopener">Buka langsung di tab baru</a>
    </div>
  </div>

  <iframe
    src="https://script.google.com/macros/s/AKfycbxXi7waJB2ZMeheiXaEj6uyDhRo9So1Ne_03ylJyBKR7Ac2Culg4V--1s-_u7GjPQ7mmw/exec"
    title="Perkalian & Pembagian Dasar"
    allowfullscreen>
  </iframe>
</body>
</html>
